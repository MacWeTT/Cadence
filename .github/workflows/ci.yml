name: CI

# A pull request into develop runs only the quick checks (format, lint, types, unit tests, build). The database tests and
# the browser tests run on a pull request into master (a release) and on every deploy, which calls this workflow.
on:
  pull_request:
  workflow_call:

# A new push to a pull request replaces its running checks. Deploys are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # The build does not talk to a database; these only need to exist.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      # The static copy the desktop app bundles: it fails if any server code reaches the screens.
      - run: npm run build:desktop
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  # The browser tests take about four minutes in one piece, so they run as four shards at once, each on its own database.
  e2e:
    # A skipped matrix job cannot fill in the shard number, so the name has none; running shards show as "... (1)".
    name: Playwright, release PRs only
    # Not for a pull request into develop (see the top of this file). A deploy calls this with the push event.
    if: github.event_name != 'pull_request' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # `supabase start` reads these from the environment (see supabase/config.toml); the values are never used.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start local Supabase and apply the migrations
        run: supabase start -x imgproxy,vector,logflare,edge-runtime,supavisor,mailpit
      - name: Database tests (pgTAP)
        # One shard is enough: the database is the same in all of them.
        if: matrix.shard == 1
        run: supabase test db
      - name: Write .env.local from the local stack
        run: |
          supabase status -o env > status.env
          set -a; source status.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          } > .env.local
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/

  # The check the branch rules wait for: it passes when every shard did, or when they were left out on purpose.
  database-and-e2e:
    name: Database tests and Playwright
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed, or was skipped
        run: test "${{ needs.e2e.result }}" = "success" || test "${{ needs.e2e.result }}" = "skipped"
